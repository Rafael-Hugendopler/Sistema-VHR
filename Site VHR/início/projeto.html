
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VHR Truck Center | Login</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <main>

        <div class="logo-container">
            <img
                src="logo-vhr-transparente.png"
                alt="Logo VHR Truck Center"
            >
        </div>

        <div class="login-content">

            <!-- CABEÇALHO -->
            <div class="login-header">

                <span class="login-label">
                    🔒 ACESSO RESTRITO
                </span>

                <h2>Bem-vindo de volta</h2>

                <p>
                    Entre com suas credenciais para
                    acessar o sistema.
                </p>

            </div>

            <!-- FORMULÁRIO -->
            <form action="dashboard.html">

                <!-- USUÁRIO -->
                <div class="input-group">

                    <label for="usuario">USUÁRIO</label>

                    <div class="input-wrapper">

                        <span class="input-icon" aria-hidden="true">
                            👤
                        </span>

                        <input
                            type="text"
                            id="usuario"
                            name="usuario"
                            placeholder="Digite seu usuário"
                            autocomplete="username"
                            required
                        >

                    </div>

                </div>

                <!-- SENHA -->
                <div class="input-group">

                    <label for="senha">SENHA</label>

                    <div class="input-wrapper">

                        <span class="input-icon" aria-hidden="true">
                            🔑
                        </span>

                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            placeholder="Digite sua senha"
                            autocomplete="current-password"
                            required
                        >

                    </div>

                </div>

                <!-- OPÇÕES -->
                <div class="login-options">

                    <label class="remember">

                        <input
                            type="checkbox"
                            id="mostrar-senha"
                            onchange="mostrarSenha()"
                        >

                        <span>Mostrar senha</span>

                    </label>

                    <a href="#" onclick="return false;">
                        Esqueci minha senha
                    </a>

                </div>

                <!-- BOTÃO -->
                <button
                    type="submit"
                    class="login-button"
                >

                    <span>ENTRAR NO SISTEMA</span>

                    <strong aria-hidden="true">→</strong>

                </button>

            </form>

            <!-- STATUS -->
            <div class="login-status">

                <span class="status-dot"></span>

                Sistema operacional

            </div>

        </div>

        <!-- RODAPÉ -->
        <div class="login-footer">
            © 2026 VHR Truck Center
        </div>

    </main>

    <script>
        function mostrarSenha() {

            const senha = document.getElementById("senha");
            const checkbox = document.getElementById("mostrar-senha");

            senha.type = checkbox.checked ? "text" : "password";

        }
    </script>

</body>

</html>
